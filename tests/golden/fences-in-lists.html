<h1 id="fences-after-list-items">Fences after list items</h1>
<p>A fence in an item’s first chunk ends the list:</p>
<ul>
<li>a</li>
</ul>
<pre><code>x</code></pre>
<ol type="1">
<li>a</li>
<li>b continued</li>
</ol>
<pre><code>y</code></pre>
<p>After a blank line or a nested list it joins the item:</p>
<ul>
<li><p>a</p>
<p>b</p>
<pre><code>z</code></pre></li>
<li><p>a</p>
<ul>
<li>nested</li>
</ul>
<pre><code>w</code></pre></li>
</ul>
