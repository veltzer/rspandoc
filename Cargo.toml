[package]
name = "rspandoc"
version = "0.1.15"
edition = "2024"
authors = ["Mark Veltzer <mark.veltzer@gmail.com>"]
description = "A pandoc replacement in Rust"
keywords = ["pandoc", "document-conversion", "markdown", "html"]
categories = ["command-line-utilities", "text-processing"]
license = "MIT"
repository = "https://github.com/veltzer/rspandoc"

# Dev builds favour compile speed: line tables keep file:line in backtraces
# at a fraction of full debug info's link cost, and dependencies get light
# optimization once (they rarely change) so tests run faster.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# Everyday release builds: thin LTO keeps most of the gain while using every
# core. The fully optimized binary is the dist profile below.
[profile.release]
strip = true
lto = "thin"

# What ships: CI's release job builds this (`cargo build --profile dist`).
# Fat LTO with one codegen unit is slow to build and only worth it here.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
md-5 = "0.11"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig", "dump-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# The fleet's lint table, the same in every rs* crate. rustc's own warnings
# are errors in every build, not only in the gate. clippy's default lints are
# errors too, and its pedantic and nursery groups are on: the gate runs
# clippy with -D warnings, so each of those fails the build as well.
[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# clippy's cargo group, lint by lint: the manifest's metadata, features and
# dependencies. multiple_crate_versions is not among them: every duplicate
# comes from upstream (deny.toml, where it is a warning, says the same).
cargo_common_metadata = "warn"
negative_feature_names = "warn"
redundant_feature_names = "warn"
wildcard_dependencies = "warn"
# clippy restriction lints, named one by one: leftovers that must not ship.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
