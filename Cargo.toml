[package]
name = "rspandoc"
version = "0.1.8"
edition = "2024"
authors = ["Mark Veltzer <mark.veltzer@gmail.com>"]
description = "A subset of pandoc implemented in Rust"
keywords = ["pandoc", "document-conversion", "markdown", "html"]
categories = ["command-line-utilities", "text-processing"]
license = "MIT"
repository = "https://github.com/veltzer/rspandoc"

# Dev builds favour compile speed: line tables keep file:line in backtraces
# at a fraction of full debug info's link cost, and dependencies get light
# optimization once (they rarely change) so tests run faster.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# Everyday release builds: thin LTO keeps most of the gain while using every
# core. The fully optimized binary is the dist profile below.
[profile.release]
strip = true
lto = "thin"

# What ships: CI's release job builds this (`cargo build --profile dist`).
# Fat LTO with one codegen unit is slow to build and only worth it here.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
